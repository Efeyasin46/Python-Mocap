name: Feature request
description: Suggest a focused improvement to MotionForge
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the simplest useful version of the feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: workflow
    attributes:
      label: Main workflow
      options: [Capture, Review, Bake, Blender export, Unity export, Other]
