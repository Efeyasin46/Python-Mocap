<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">MotionForge Studio — webcam motion capture</title>
  <desc id="desc">A motion-capture landmark figure beside the MotionForge desktop studio interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a2c"/><stop offset="1" stop-color="#1c2a43"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55d6c2" stop-opacity=".24"/><stop offset="1" stop-color="#55d6c2" stop-opacity="0"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
    <style>
      .label{font:600 18px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#8fa4bd}
      .copy{font:500 23px 'Segoe UI',Arial,sans-serif;fill:#d8e3f0}
      .small{font:500 16px 'Segoe UI',Arial,sans-serif;fill:#9eb0c7}
      .line{fill:none;stroke:#54d6c2;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .joint{fill:#b8fff2;stroke:#183047;stroke-width:5}
    </style>
  </defs>
  <rect width="1600" height="760" rx="36" fill="url(#bg)"/>
  <circle cx="560" cy="370" r="260" fill="url(#glow)" filter="url(#blur)"/>
  <path d="M40 650H1560M40 110H1560" stroke="#ffffff" stroke-opacity=".07"/>
  <text x="88" y="82" class="label">WEBCAM MOTION CAPTURE · WINDOWS</text>
  <text x="88" y="178" fill="#f4f7fb" font-family="Segoe UI,Arial,sans-serif" font-size="66" font-weight="700">MotionForge <tspan fill="#57d8c4">Studio</tspan></text>
  <text x="92" y="225" class="copy">Capture. Review. Export.</text>
  <text x="92" y="280" class="small">Turn webcam movement into motion data you can inspect</text>
  <text x="92" y="307" class="small">and take into your Blender or Unity workflow.</text>
  <g transform="translate(65 370)">
    <rect width="310" height="176" rx="18" fill="#0b1423" stroke="#31435b" stroke-width="2"/>
    <rect x="16" y="16" width="278" height="118" rx="12" fill="#1b3143"/>
    <path d="M34 106 Q100 90 145 42T275 37" fill="none" stroke="#57d8c4" stroke-opacity=".22" stroke-width="15" stroke-linecap="round"/>
    <circle cx="154" cy="55" r="9" fill="#57d8c4"/><circle cx="132" cy="78" r="7" fill="#57d8c4"/><circle cx="176" cy="78" r="7" fill="#57d8c4"/>
    <path d="M154 64L132 78L119 103M154 64L176 78L192 101M132 78L176 78" fill="none" stroke="#57d8c4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="25" cy="154" r="6" fill="#ff8a65"/><text x="41" y="160" class="small">LIVE CAPTURE</text>
    <text x="205" y="160" class="small">WEBCAM</text>
  </g>
  <g transform="translate(535 355)">
    <path class="line" d="M134 59L126 174L87 283M126 174L172 276M126 103L55 145L27 205M126 103L205 135L250 194M126 174L91 206L172 208"/>
    <circle class="joint" cx="134" cy="45" r="28"/><circle class="joint" cx="126" cy="101" r="11"/><circle class="joint" cx="126" cy="174" r="12"/>
    <circle class="joint" cx="55" cy="145" r="10"/><circle class="joint" cx="27" cy="205" r="10"/><circle class="joint" cx="205" cy="135" r="10"/><circle class="joint" cx="250" cy="194" r="10"/>
    <circle class="joint" cx="87" cy="283" r="10"/><circle class="joint" cx="172" cy="276" r="10"/><circle class="joint" cx="91" cy="206" r="9"/><circle class="joint" cx="172" cy="208" r="9"/>
    <path d="M8 320C87 289 172 350 282 309" fill="none" stroke="#ff9b72" stroke-width="3" stroke-dasharray="9 12" opacity=".8"/>
    <text x="18" y="362" class="label">POSE LANDMARKS</text>
  </g>
  <g transform="translate(930 286)">
    <rect width="590" height="355" rx="24" fill="#101a29" stroke="#3b4d64" stroke-width="2"/>
    <path d="M0 58H590" stroke="#3b4d64" stroke-width="2"/>
    <circle cx="30" cy="29" r="7" fill="#ff8a65"/><circle cx="54" cy="29" r="7" fill="#f2c66d"/><circle cx="78" cy="29" r="7" fill="#57d8c4"/>
    <text x="112" y="36" class="small">MOTIONFORGE · STUDIO</text>
    <rect x="22" y="78" width="342" height="235" rx="15" fill="#192a3b"/>
    <path d="M46 263H341M46 205H341M46 147H341" stroke="#93a7bd" stroke-opacity=".14"/>
    <path d="M65 270L104 245L142 253L181 173L219 188L258 129L296 143L333 104" fill="none" stroke="#57d8c4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="258" cy="129" r="7" fill="#d4fff5"/>
    <rect x="386" y="80" width="182" height="56" rx="12" fill="#203449"/><circle cx="412" cy="108" r="9" fill="#57d8c4"/><text x="433" y="115" class="small">RECORD TAKE</text>
    <rect x="386" y="150" width="182" height="56" rx="12" fill="#203449"/><path d="M406 180h15m-8-8v16" stroke="#ff9b72" stroke-width="3"/><text x="433" y="185" class="small">REVIEW MOTION</text>
    <rect x="386" y="220" width="182" height="56" rx="12" fill="#203449"/><path d="M406 244h18v19h-18zM410 239h10" fill="none" stroke="#9eb0c7" stroke-width="2"/><text x="433" y="255" class="small">EXPORT BVH</text>
    <text x="24" y="339" class="small">Capture · Library · Bake · Export</text>
  </g>
  <text x="88" y="704" class="label">OPEN-SOURCE PREVIEW · WINDOWS x64</text>
  <text x="1285" y="704" class="small">MOTION IN YOUR HANDS</text>
</svg>
